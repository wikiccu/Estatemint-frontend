<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Office property placeholder</title>
  <desc id="desc">Replace with a real office photo sized 1200 by 900 pixels.</desc>
  <rect width="1200" height="900" fill="#15171a"/>
  <rect x="260" y="180" width="680" height="610" rx="26" fill="#ffffff"/>
  <g fill="#315d78">
    <rect x="340" y="270" width="110" height="95" rx="8"/>
    <rect x="545" y="270" width="110" height="95" rx="8"/>
    <rect x="750" y="270" width="110" height="95" rx="8"/>
    <rect x="340" y="445" width="110" height="95" rx="8"/>
    <rect x="545" y="445" width="110" height="95" rx="8"/>
    <rect x="750" y="445" width="110" height="95" rx="8"/>
  </g>
  <rect x="545" y="620" width="110" height="170" rx="8" fill="#123c35"/>
  <text x="600" y="95" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="42" font-weight="700">Office Photo Placeholder</text>
  <text x="600" y="145" text-anchor="middle" fill="#d5a249" font-family="Arial, sans-serif" font-size="28">Use real image - 1200x900</text>
</svg>
